name: Build APK

# Har push pe GitHub khud APK banake Artifacts me de dega.
# Download: repo > Actions tab > latest run > Artifacts > RecoveryXPro-debug-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" --sdk_root="$ANDROID_SDK_ROOT" > /dev/null

      - name: Restore debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        uses: gradle/actions/setup-gradle@v4
        with:
          arguments: ":app:assembleDebug --stacktrace"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RecoveryXPro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
